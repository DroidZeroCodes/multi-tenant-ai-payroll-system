name: payroll-server

services:
  postgres:
    image: 'postgres:latest'
    container_name: 'payroll-system-db'
    restart: unless-stopped
    env_file:
      - .env.dev
    ports:
      - '3003:5432'
    volumes:
      - payroll_system_db_data:/var/lib/postgresql/data-flyway
    networks:
      - payroll_system_net

  redis:
    image: 'redis:latest'
    container_name: 'payroll-system-redis'
    restart: unless-stopped
    env_file:
      - .env.dev
    ports:
      - '3004:6379'
    volumes:
      - payroll_system_db_redis:/var/lib/redis/data
    networks:
      - payroll_system_net

volumes:
  payroll_system_db_data:
    driver: local
  payroll_system_db_redis:
    driver: local

networks:
  payroll_system_net:
    driver: bridge

